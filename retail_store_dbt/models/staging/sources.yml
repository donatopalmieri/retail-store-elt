version: 2

sources:
  - name: staging_raw
    description: "Tabelle di staging caricate in DuckDB tramite lo script Python ETL."
    database: warehouse  # Nome del tuo file DuckDB, non va inserito .duckdb
    schema: main          # Schema di default di DuckDB
    
    tables:
      - name: raw_clienti
        description: "Anagrafica dei clienti."
      - name: raw_categorie
        description: "Categorie dei prodotti."
      - name: raw_prodotti
        description: "Catalogo dei prodotti in vendita."
      - name: raw_ordini
        description: "Testata degli ordini effettuati dai clienti."
      - name: raw_dettaglio_ordini
        description: "Righe di dettaglio dei singoli ordini."
      - name: raw_eventi_web
        description: "Tracciamento degli eventi web (clickstream)."
      - name: raw_resi
        description: "Gestione dei resi e dei rimborsi."